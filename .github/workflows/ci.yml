name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore EuroTrade-Cloud.sln

      - name: Build
        run: dotnet build EuroTrade-Cloud.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test EuroTrade-Cloud.sln --no-build --configuration Release
