name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore EuroTrade-Cloud.sln

      - name: Build
        run: >
          dotnet build EuroTrade-Cloud.sln
          --no-restore
          --configuration Release
          --warnaserror

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U eurotrade -d eurotrade; then
              echo "PostgreSQL is ready"
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready"
          docker compose logs postgres
          exit 1

      - name: Apply database migrations
        env:
          ConnectionStrings__OrdersDb: Host=localhost;Port=5432;Database=eurotrade;Username=eurotrade;Password=eurotrade
        run: >
          dotnet ef database update
          --project src/EuroTrade.Infrastructure/EuroTrade.Infrastructure.csproj
          --startup-project src/EuroTrade.Api/EuroTrade.Api.csproj
          --configuration Release

      - name: Run tests
        run: >
          dotnet test EuroTrade-Cloud.sln
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes
