replicaCount: 2

image:
  repository: eurotradedevacr.azurecr.io/eurotrade-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

containerPort: 8080

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsUser: 1654
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  automount: true

  annotations:
    azureWorkloadIdentityClientId: "0da8274a-6255-4cb4-be39-4188c3c1581c"

env:
  ASPNETCORE_ENVIRONMENT: Production

  KeyVault__Name: eurotradedevkv

  ServiceBus__FullyQualifiedNamespace: eurotradedevservicebus.servicebus.windows.net
  ServiceBus__QueueName: orders

postgres:
  host: eurotrade-dev-postgresql.postgres.database.azure.com
  port: 5432
  database: eurotrade
  username: eurotradeadmin
