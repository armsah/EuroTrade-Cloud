replicaCount: 2

image:
  repository: eurotradedevacr.azurecr.io/eurotrade-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

containerPort: 8080

probes:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  automount: true
  annotations:
    azure.workload.identity/client-id: "f2ea425e-d151-4941-bc0d-52d8eaf8def5"

env:
  ASPNETCORE_ENVIRONMENT: Production
  KeyVault__Name: eurotradedevkv
  ServiceBus__FullyQualifiedNamespace: sb-eurotrade-dev.servicebus.windows.net
  ServiceBus__QueueName: order-created

postgres:
  host: eurotrade-dev-postgresql.postgres.database.azure.com
  port: 5432
  database: eurotrade
  username: eurotradeadmin
